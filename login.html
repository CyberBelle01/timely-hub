<!DOCTYPE html>
<html lang="en">
<head>
   <title>Timely Hub - Login</title>
   <link rel="stylesheet" href="style2.css">

</head>
<body>
     <div class="login-container">
        <div class="login-box">
            <div class="brand">
         <a href="index.html"><img src="logo.png" alt="Timely Hub Logo" class="logo"></a>
         
         
            </div>
           
            <h2>Log in to your account</h2>
            <form>
                <label for="email">Email or Username</label>
                <input type="text" id="email" placeholder="Enter Email or Username">
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password">

                <div class="forgot-password">
                    <p>Forgot Password?</p>
                </div>
                <button type="submit">Log In</button>

            </form>
                <span class="no-password">Don't have an account?</span>
                <span class="signup">Sign up</span>
            
        
        </div>

    </div>

</body>

</html>
